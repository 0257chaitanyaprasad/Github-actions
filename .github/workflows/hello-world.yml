# 1. The name of the workflow as it appears in GitHub
name: GitHub Actions Demo

# 2. The event that triggers the workflow (whenever code is pushed)
on: [push]

# 3. What the workflow actually does
jobs:
  say-hello:
    # Tell GitHub to run this on a fresh Ubuntu virtual machine
    runs-on: ubuntu-latest
    
    # The sequence of tasks to execute
    steps:
      # Step 1: Print a message in the logs
      - name: Run a greeting script
        run: echo "Hello, world! You just triggered your first GitHub Action."

      # Step 2: Show the server's time
      - name: Check server time
        run: date
