# 1. The name of our robot's task
name: My First Automation Robot

# 2. The Trigger: A manual button on the GitHub website
on: 
  workflow_dispatch:

# 3. The Work: What the robot actually does
jobs:
  run-robot-tasks:
    # Use a fresh, clean Ubuntu computer in GitHub's cloud
    runs-on: ubuntu-latest
    
    steps:
      # Step A: Print a simple greeting in the logs
      - name: Say Hello
        run: echo "Hello! Your GitHub Actions robot is awake and working."

      # Step B: Print the GitHub Variable
      - name: Print the GitHub Variable
        # 🎯 FIX 1: env must be formatted as key: value pairs under a step, not a lone text string.
        # 🎯 FIX 2: Space before colon removed (env:), indented correctly with 8 spaces.
        env:
          My_Pass: ${{ secrets.My_Use_Pass }}
        # This will print the exact plain text stored in your variable
        run: echo "The Salesforce User is ${{ vars.My_User }}"

      # Step C: Print the GitHub Secret (Secured)
      - name: Print the GitHub Secret (Secured)
        # This will run, but GitHub will display '***' in the logs to protect it!
        run: echo "The Salesforce Secret Key is ${{ secrets.My_Use_Pass }}"
