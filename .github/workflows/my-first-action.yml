# 1. The name of our robot's task
name: My First Automation Robot

# 2. The Trigger: A manual button on the GitHub website
on: 
  workflow_dispatch:

# 3. The Work: What the robot actually does
jobs:
  run-robot-tasks:
    # Use a fresh, clean Ubuntu computer in GitHub's cloud
    runs-on: ubuntu-latest
    
    # 🎯 THE FIX: This unlocks the secrets and variables stored inside your "My_Pass" environment!
    environment: My_Pass
    
    steps:
      # Step A: Print a simple greeting in the logs
      - name: Say Hello
        run: echo "Hello! Your GitHub Actions robot is awake and working."

      # Step B: Print the GitHub Variable
      - name: Print the GitHub Variable
        env:
          My_Pass_Env: ${{ secrets.MY_PASS_USER }}
        # This will now successfully print "ABCDEF" from your environment variables!
        run: echo "The Salesforce User is ${{ vars.USER_ME }}"

      # Step C: Print the GitHub Secret (Secured)
      - name: Print the GitHub Secret (Secured)
        # This will now run successfully, and GitHub will display '***' instead of blank text!
        run: echo "The Salesforce Secret Key is ${{ secrets.MY_PASS_USER }}"
