<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Home</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 8%;
      background: #ffffff;
    }
    .logo { font-size: 1.4rem; font-weight: bold; color: #2563eb; }
    nav a {
      margin-left: 1.5rem;
      color: #374151;
      text-decoration: none;
    }
    nav a:hover { color: #2563eb; }
    main {
      min-height: calc(100vh - 140px);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 4rem 1.5rem;
    }
    .hero { max-width: 650px; }
    h1 { margin-bottom: 1rem; font-size: clamp(2.5rem, 6vw, 4.5rem); }
    p { font-size: 1.15rem; line-height: 1.6; color: #6b7280; }
    .button {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.85rem 1.5rem;
      border-radius: 0.5rem;
      background: #2563eb;
      color: white;
      text-decoration: none;
    }
    .button:hover { background: #1d4ed8; }
    footer { padding: 1.5rem; text-align: center; color: #6b7280; background: #ffffff; }
  </style>
</head>
<body>
  <header>
    <div class="logo">YourBrand</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="home">
    <section class="hero">
      <h1>Welcome to YourBrand</h1>
      <p>A simple, friendly place to discover what we do and how we can help you get started.</p>
      <a class="button" href="#about">Learn More</a>
    </section>
  </main>

  <footer>&copy; 2025 YourBrand. All rights reserved.</footer>
</body>
</html>
